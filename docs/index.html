<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RBY Invest</title>
<meta name="description" content="RBY Invest – market data and company reviews.">
<link rel="icon" href="/rby-logo.jpg">
<style>
  :root { --navy:#0b2a55; --muted:#64748b; --line:#d9e1ee; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #fff; color: var(--navy);
         font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 20px; text-align: center; }
  .logo { width: min(560px, 88vw); height: auto; display: block; }
  nav { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 44px; }
  nav a { display: inline-block; padding: 14px 26px; border-radius: 10px; border: 1px solid var(--navy); color: var(--navy);
          text-decoration: none; font-size: 17px; font-weight: 600; width: 230px; }
  nav a:hover { background: var(--navy); color: #fff; }
  nav a:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
  footer { padding: 18px; text-align: center; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <img class="logo" src="/rby-logo.jpg" alt="RBY Invest" width="900" height="285">
  <nav aria-label="Main">
    <a href="/market/">Market Data</a>
    <a href="/reviews/bits-of-gold/">Company Review</a>
  </nav>
</main>
<footer>&copy; RBY Invest</footer>
</body>
</html>
