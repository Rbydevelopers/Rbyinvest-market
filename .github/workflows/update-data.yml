name: Update market data

on:
  schedule:
    # Every hour, 06:00–23:00 Israel time (03:00–20:00 UTC). Cron is always UTC.
    - cron: "7 3-20 * * *"
  workflow_dispatch:        # lets you press "Run workflow" manually on GitHub

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # optional; see README
        run: python scripts/fetch_data.py

      - name: Commit data.json if it changed
        run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
